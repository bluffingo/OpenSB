<style name="player-styles-temporary">
    .video-player {
        position: relative;
        width: 100%;
        height: 100%;
    }

    .video-controls {
        z-index: 50;
        display: block;
        position: absolute;
        bottom: 0;
        width: 100%;
    }

    .player-progress-bar {
        background: #444444;
        height: 8px;
    }

    .player-progress-bar-elapsed {
        background: #cc181e;
        width: 0px;
        height: 100%;
    }

    .player-scrubber {
        border: 5px solid #eaeaea;
        border-radius: 8px;
        background: #aeaeae;
        height: 16px;
        width: 16px;
        top: -4px;
        margin-left: -8px;
        z-index: 10;
        position: absolute;
        cursor: pointer;
    }

    .player-scrubber:hover {
        background: #cc181e;
    }

    .player-chrome {
        background: #1B1B1B;
        height: 27px;
        display: flex;
        align-items: center;
    }

    .player-button {
        cursor: pointer;
    }

    .player-button-play {
        background: green;
        width: 55px;
        height: 27px;
    }

    .player-button-pause {
        background: yellow;
        width: 55px;
        height: 27px;
    }

    .player-time-display {
        font-size: 11px;
        color: white;
    }
</style>
<div id="video-player" class="video-player">
    <div class="video-container"></div>
    <div class="video-controls">
        <div class="player-progress">
            <div class="player-scrubber"></div>
            <div class="player-progress-bar">
                <div class="player-progress-bar-elapsed"></div>
            </div>
        </div>
        <div class="player-chrome">
            <div class="player-button player-button-play"></div>
            <div class="player-time-display">incomplete!</div>
        </div>
    </div>
</div>
